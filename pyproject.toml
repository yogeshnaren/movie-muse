[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-muse"
version = "2.1.0"
description = "Creator-controlled professional filmmaking workspace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Movie Muse" }]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts", "backend"]
extend-exclude = ["movie_script_files", "ml", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["E402"]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["movie_muse"]
strict = true
warn_unused_ignores = true
show_error_codes = true
implicit_reexport = true

[tool.pytest.ini_options]
pythonpath = ["src", "backend", "."]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "architecture: module boundary and layout contracts",
  "toolchain: status, fingerprint, and scope tools",
  "security: secret scanning and safety checks",
]
