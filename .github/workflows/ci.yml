name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r backend/requirements.txt

      - name: Validate handoff, DAG, and scopes
        run: |
          python scripts/validate_handoff.py
          PYTHONPATH=src python scripts/mm_status.py validate
          PYTHONPATH=src python scripts/mm_status.py check-scopes

      - name: Lint and typecheck
        run: |
          python -m ruff check src tests scripts backend
          python -m mypy

      - name: Module boundaries and secret scan
        run: |
          PYTHONPATH=src python scripts/mm_status.py boundaries
          PYTHONPATH=src python scripts/mm_status.py secrets

      - name: Run Python tests
        run: PYTHONPATH=src python -m pytest

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck and tests
        working-directory: frontend
        run: |
          npm run typecheck
          npm run test -- --run
