schema_version: "2.0"
package_version: "2.1.0"
graph_id: movie-muse-working-prototype-v2
semantics:
  edge_direction: "depends_on points from a node to its prerequisites"
  scheduling: "a node is runnable only when every prerequisite is PASS and current"
  invalidation: "a relevant input change marks the node STALE and recursively marks every transitive dependent STALE"
  pass_binding: "PASS binds to verification_commit plus input_fingerprint"
  resurrection: "STALE can become PASS only through successful reverification; reverting files does not restore PASS"
  cycles: forbidden
  unknown_dependencies: forbidden
  self_dependencies: forbidden
relevant_input_classes:
  - product_source
  - tests_and_fixtures
  - domain_or_api_schema
  - database_migration
  - dependency_lockfile
  - build_or_runtime_configuration
  - prompt_template_or_model_policy
  - rights_or_evaluation_policy
  - verification_script
