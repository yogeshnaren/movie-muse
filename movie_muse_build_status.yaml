allowed_statuses:
  - NOT_STARTED
  - IN_PROGRESS
  - PASS
  - FAIL
  - BLOCKED_EXTERNAL
  - STALE
status_rules:
  NOT_STARTED: implementation or verification has not begun
  IN_PROGRESS: active work; never counts as complete
  PASS: all acceptance and independent verification passed at pass_record.verification_commit and input_fingerprint
  FAIL: implementation or verification failed; root cause and next action required
  BLOCKED_EXTERNAL: exact external prerequisite is absent; never counts as PASS
  STALE: a relevant input or prerequisite changed after PASS; reverification required
completion_policy:
  pass_requires_all_dependencies_current_pass: true
  pass_requires_independent_verifier: true
  pass_requires_clean_commit: true
  pass_requires_commands_and_evidence: true
  relevant_change_invalidates_pass: true
  dependent_closure_invalidation: true
  automatic_pass_resurrection: false
  mocks_satisfy_required_live_gates: false
  final_gate_item: MM-047
  success_sentinel: MOVIE_MUSE_PROTOTYPE_VERIFICATION=PASS
input_fingerprint_policy:
  algorithm: sha256
  includes:
    - verification_commit
    - resolved_owned_and_shared_source_paths
    - tests_and_fixtures
    - schemas_and_migrations
    - dependency_lockfiles
    - build_runtime_and_model_policy_configuration
    - prompts_templates_rights_and_evaluation_policy
    - verifier_scripts
    - direct_dependency_pass_fingerprints
  path_mapping_file_required_at_implementation: config/verification-scopes.yaml
