# Secret-safe configuration policy. Real credentials never live in the repository.
schema_version: "2.0"
env_file:
  committed_example: ".env.example"
  local_file: ".env"
  local_file_gitignored: true
disallowed_in_source:
  - AWS Access Key IDs (AKIA...)
  - PEM private keys
  - Slack/GitHub/OpenAI-style live tokens
  - Connection strings with embedded passwords
allowed_placeholders:
  - CHANGE_ME
  - YOUR_KEY_HERE
  - "replace-me"
  - "sk-test-not-a-real-key"
scan_roots:
  - .
exclude_globs:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/__pycache__/**"
  - "**/movie_script_files/**"
  - "**/*.lock"
  - "**/package-lock.json"
report_path: evidence/secret-scan.txt
