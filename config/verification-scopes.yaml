# Maps every movie_muse_build_status.yaml scope_key to owned/shared paths.
# Fingerprints hash owned+shared paths after applying fingerprint_exclude_globs.
# A changed file that matches no scope fails status validation.
schema_version: "2.0"
unmatched_paths_fail: true
empty_owned_paths_fail_when_item_exists:
  statuses: [IN_PROGRESS, PASS, STALE, FAIL]
fingerprint_exclude_globs:
  - movie_muse_build_status.yaml
  - docs/working-log.md
  - evidence/**
  - "**/.gitkeep"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/.pytest_cache/**"
  - "**/.mypy_cache/**"
  - "**/.ruff_cache/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/dist/**"
  - "**/coverage/**"
shared_ignore_globs:
  - "**/.git/**"
scopes:
  global.toolchain:
    owned:
      - src/movie_muse/toolchain/**
      - src/movie_muse/__init__.py
      - src/movie_muse/py.typed
      - pyproject.toml
      - requirements-dev.txt
      - Makefile
      - scripts/bootstrap.sh
      - scripts/mm_status.py
      - .tool-versions
      - .python-version
      - .nvmrc
      - config/runtimes.yaml
      - config/module-layout.yaml
      - config/module-boundaries.yaml
      - config/secrets-policy.yaml
      - docs/adr/**
      - tests/architecture/**
      - tests/toolchain/**
      - tests/security/**
      - .env.example
      - backend/requirements.txt
      - backend/pytest.ini
      - backend/tests/**
      - artifacts/**
    shared:
      - config/verification-scopes.yaml
      - dependency_dag.yaml
      - schemas/build-status.schema.json
      - scripts/validate_handoff.py
      - AGENTS.md
      - .cursor/rules/**
      - .cursor/agents/**
  global.ci:
    owned:
      - .github/workflows/ci.yml
      - scripts/verify_all.sh
      - scripts/gates/manifest_and_staleness.sh
      - scripts/gates/static_quality_and_boundaries.sh
      - docker-compose.yml
      - backend/Dockerfile
      - frontend/Dockerfile
      - tests/release/**
    shared:
      - config/verification-scopes.yaml
      - config/runtimes.yaml
      - .github/workflows/**
  global.manifest:
    owned:
      - movie_muse_build_status.yaml
      - docs/working-log.md
      - evidence/**
    shared: []
    fingerprint: false
  domain.schemas:
    owned:
      - src/movie_muse/schemas/**
      - schemas/domain/**
      - tests/schemas/**
    shared:
      - schemas/build-status.schema.json
  module.document:
